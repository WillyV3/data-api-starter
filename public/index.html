<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data API</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fafafa; --mut: #666; --line: #ddd; --acc: #0a7d3c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --mut: #999; --line: #333; --acc: #4ade80; } }
  body { font: 16px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); background: var(--bg); max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p, label { color: var(--mut); }
  form, section { border: 1px solid var(--line); padding: 16px; margin: 24px 0; }
  input, button { font: inherit; padding: 8px; width: 100%; box-sizing: border-box; margin: 4px 0 12px; }
  button { background: var(--acc); color: var(--bg); border: 0; cursor: pointer; }
  pre { overflow-x: auto; border: 1px solid var(--line); padding: 12px; }
  a { color: var(--acc); }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Data API</h1>
<p>Sign up, create an API key, query the data. <a href="/docs">API docs</a></p>

<form id="auth">
  <label>Email <input name="email" type="email" required autocomplete="email"></label>
  <label>Password (8+ characters) <input name="password" type="password" minlength="8" required autocomplete="current-password"></label>
  <button name="mode" value="sign-up">Sign up</button>
  <button name="mode" value="sign-in">Sign in</button>
</form>

<section id="dash" hidden>
  <p>Signed in as <span id="who"></span>. <a href="#" id="out">Sign out</a></p>
  <button id="newkey">Create API key</button>
  <div id="keybox" hidden>
    <p>Copy it now. It is shown once.</p>
    <pre id="key"></pre>
    <pre id="curl"></pre>
  </div>
</section>
<p id="msg" role="status"></p>

<script>
const $ = (id) => document.getElementById(id)
const api = async (path, body) => {
  const r = await fetch('/api/auth' + path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  const j = await r.json().catch(() => null)
  if (!r.ok) throw new Error(j?.message || 'Request failed (' + r.status + ')')
  return j
}
const refresh = async () => {
  const s = await api('/get-session').catch(() => null)
  $('auth').hidden = !!s?.user
  $('dash').hidden = !s?.user
  if (s?.user) $('who').textContent = s.user.email
}
$('auth').addEventListener('submit', async (e) => {
  e.preventDefault()
  const { email, password } = Object.fromEntries(new FormData(e.target))
  const mode = e.submitter.value
  $('msg').textContent = ''
  try {
    await api('/' + mode + '/email', mode === 'sign-up' ? { email, password, name: email.split('@')[0] } : { email, password })
    await refresh()
  } catch (err) { $('msg').textContent = err.message }
})
$('newkey').addEventListener('click', async () => {
  try {
    const k = await api('/api-key/create', { name: 'default' })
    $('key').textContent = k.key
    $('curl').textContent = 'curl -H "x-api-key: ' + k.key + '" "' + location.origin + '/v1/orgs?state=NY"'
    $('keybox').hidden = false
  } catch (err) { $('msg').textContent = err.message }
})
$('out').addEventListener('click', async (e) => { e.preventDefault(); await api('/sign-out', {}); $('keybox').hidden = true; refresh() })
refresh()
</script>
</body>
</html>
